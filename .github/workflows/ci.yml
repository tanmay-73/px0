name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Bundle, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # web/dist is not committed: bundle the frontend (Monaco) so go:embed
      # has it, and run the frontend checks and tests.
      - name: Bundle web assets
        run: |
          bun install
          node ./scripts/build-web.js
          node ./scripts/check-web.js

      - name: Build px0
        run: go build -trimpath -o px0 .

      - name: Run tests
        run: go test -v ./...
